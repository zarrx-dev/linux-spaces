name: Bug report
description: Something does not work as expected, or the session crashed.
labels: ["bug"]
body:
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      description: Output of `gnome-shell --version`
      placeholder: GNOME Shell 46.0
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and session
      placeholder: Ubuntu 24.04, Wayland
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Linux Spaces version or commit
    validations:
      required: true
  - type: input
    id: monitors
    attributes:
      label: Monitors
      placeholder: One laptop screen, or laptop plus one external
  - type: input
    id: app
    attributes:
      label: App and how full screen or maximize started
      placeholder: Firefox, F11
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
      description: Mention it if the session crashed or logged you out.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output of `journalctl -b -o cat /usr/bin/gnome-shell | grep -i -E "linux-spaces|JS ERROR"`
      render: text
