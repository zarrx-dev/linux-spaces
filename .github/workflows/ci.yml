name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install GLib tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin
      - name: Lint
        run: make lint
      - name: Compile schemas
        run: make schemas
